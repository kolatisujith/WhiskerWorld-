<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Whisker World - Every Paw Deserves a Loving Home. Pet adoption platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Whisker World">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Whisker World — Every Paw Deserves a Loving Home</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #FAF7F2;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-box {
      text-align: center;
    }
    .loading-paw {
      font-size: 52px;
      animation: pulse 1.4s ease-in-out infinite;
      display: inline-block;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #22252A;
      margin-top: 12px;
      letter-spacing: -0.5px;
    }
    .loading-subtitle {
      font-size: 14px;
      color: #717680;
      margin-top: 6px;
      font-weight: 500;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-box">
    <div class="loading-paw">🐾</div>
    <div class="loading-title">Whisker World</div>
    <div class="loading-subtitle">Every Paw Deserves a Loving Home.</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
